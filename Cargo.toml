[package]
name = "maibot-manager-tui"
version = "0.1.11"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.27"
ctrlc = "3.4"
dialoguer = "0.11"
dirs = "5.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.22"

[build-dependencies]
toml_edit = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
