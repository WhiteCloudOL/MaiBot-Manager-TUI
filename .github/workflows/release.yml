name: Build and Release

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.output_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            output_name: maibot-manager-linux-x86_64
            binary_path: target/x86_64-unknown-linux-musl/release/maibot-manager-tui
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            output_name: maibot-manager-linux-arm64
            binary_path: target/aarch64-unknown-linux-musl/release/maibot-manager-tui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output_name: maibot-manager-windows-x86_64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/maibot-manager-tui.exe
          - os: macos-15
            target: aarch64-apple-darwin
            output_name: maibot-manager-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/maibot-manager-tui

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add rust-lld to PATH
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          echo "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          cp "${{ matrix.binary_path }}" "${{ matrix.output_name }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "${{ matrix.output_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -E '^version[[:space:]]*=' app.toml | head -n1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from app.toml" >&2
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sanity check artifact names
        run: |
          ls -la dist
          test -f dist/maibot-manager-linux-x86_64
          test -f dist/maibot-manager-linux-arm64
          test -f dist/maibot-manager-windows-x86_64.exe
          test -f dist/maibot-manager-macos-arm64

      - name: Build release metadata
        id: meta
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short_sha }}"
          BRANCH="${{ github.ref_name }}"

          if [ "${BRANCH}" = "main" ]; then
            TAG="v${VERSION}"
            TITLE="MaiBot Manager TUI v${VERSION}"
            PRERELEASE="false"
            RELEASE_KIND="stable release"
          elif [ "${BRANCH}" = "dev" ]; then
            TAG="${VERSION}-dev-${SHORT_SHA}"
            TITLE="MaiBot Manager TUI ${VERSION}-dev-${SHORT_SHA}"
            PRERELEASE="true"
            RELEASE_KIND="dev prerelease"
          else
            SAFE_BRANCH="${BRANCH//[^A-Za-z0-9._-]/-}"
            TAG="${VERSION}-${SAFE_BRANCH}-${SHORT_SHA}"
            TITLE="MaiBot Manager TUI ${TAG}"
            PRERELEASE="true"
            RELEASE_KIND="manual prerelease"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_kind=${RELEASE_KIND}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSIONED_NOTES=".github/release-notes/${VERSION}.md"
          mkdir -p dist/notes

          if [ -f "${VERSIONED_NOTES}" ]; then
            cp "${VERSIONED_NOTES}" dist/release-notes.md
          else
            git fetch --tags --force
            BASE_TAG=$(gh release list \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // ""' \
              --repo "${GITHUB_REPOSITORY}")
            if [ -n "${BASE_TAG}" ] && git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
              LOG_RANGE="${BASE_TAG}..${{ github.sha }}"
            else
              LOG_RANGE="${{ github.sha }}"
            fi

            : > dist/notes/feature.md
            : > dist/notes/fix.md
            while IFS='|' read -r sha subject; do
              [ -n "${sha}" ] || continue
              type=$(printf '%s' "${subject}" | sed -nE 's/^([A-Za-z]+)(\([^)]+\))?!?: .*/\1/p' | tr '[:upper:]' '[:lower:]')
              message=$(printf '%s' "${subject}" | sed -E 's/^[A-Za-z]+(\([^)]+\))?!?:[[:space:]]*//')
              case "${type}" in
                feat) printf '%s\n' "- ${message}" >> dist/notes/feature.md ;;
                fix|perf) printf '%s\n' "- ${message}" >> dist/notes/fix.md ;;
              esac
            done < <(git log "${LOG_RANGE}" --no-merges --pretty=tformat:'%h|%s')

            {
              echo "Feature:"
              cat dist/notes/feature.md
              echo
              echo "Fix:"
              cat dist/notes/fix.md
            } > dist/release-notes.md
          fi
          test -s dist/release-notes.md
          grep -q '^Feature:$' dist/release-notes.md
          grep -q '^Fix:$' dist/release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"

          CREATE_FLAGS=()
          EDIT_FLAGS=()
          if [ "${PRERELEASE}" = "true" ]; then
            CREATE_FLAGS+=(--prerelease --latest=false)
            EDIT_FLAGS+=(--prerelease)
          else
            CREATE_FLAGS+=(--latest)
            EDIT_FLAGS+=(--prerelease=false --latest)
          fi

          ASSETS=(
            dist/maibot-manager-linux-x86_64
            dist/maibot-manager-linux-arm64
            dist/maibot-manager-windows-x86_64.exe
            dist/maibot-manager-macos-arm64
          )

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "${TITLE}" \
              --notes-file dist/release-notes.md \
              --target "${{ github.sha }}" \
              --repo "${GITHUB_REPOSITORY}" \
              "${EDIT_FLAGS[@]}"
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file dist/release-notes.md \
              --target "${{ github.sha }}" \
              --repo "${GITHUB_REPOSITORY}" \
              "${CREATE_FLAGS[@]}" \
              "${ASSETS[@]}"
          fi
