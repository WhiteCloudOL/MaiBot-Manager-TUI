name: Build and Release

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.output_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            output_name: maibot-manager-linux-x86_64
            binary_path: target/x86_64-unknown-linux-musl/release/maibot-manager-tui
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            output_name: maibot-manager-linux-arm64
            binary_path: target/aarch64-unknown-linux-musl/release/maibot-manager-tui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output_name: maibot-manager-windows-x86_64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/maibot-manager-tui.exe
          - os: macos-13
            target: x86_64-apple-darwin
            output_name: maibot-manager-macos-x86_64
            binary_path: target/x86_64-apple-darwin/release/maibot-manager-tui
          - os: macos-14
            target: aarch64-apple-darwin
            output_name: maibot-manager-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/maibot-manager-tui

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add rust-lld to PATH
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          echo "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          cp "${{ matrix.binary_path }}" "${{ matrix.output_name }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "${{ matrix.output_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -E '^version[[:space:]]*=' app.toml | head -n1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from app.toml" >&2
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sanity check artifact names
        run: |
          ls -la dist
          test -f dist/maibot-manager-linux-x86_64
          test -f dist/maibot-manager-linux-arm64
          test -f dist/maibot-manager-windows-x86_64.exe
          test -f dist/maibot-manager-macos-x86_64
          test -f dist/maibot-manager-macos-arm64

      - name: Build prerelease metadata
        id: meta
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short_sha }}"
          TAG="v${VERSION}-nextdev-${SHORT_SHA}"
          TITLE="MaiBot Manager TUI v${VERSION} nextdev ${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force

          BASE_TAG=$(gh release list \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""' \
            --repo "${GITHUB_REPOSITORY}")

          if [ -n "${BASE_TAG}" ] && git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
            LOG_RANGE="${BASE_TAG}..${{ github.sha }}"
            COMPARE_TEXT="Changes since ${BASE_TAG}"
          else
            LOG_RANGE="${{ github.sha }}"
            COMPARE_TEXT="Changes in this build"
          fi

          mkdir -p dist/notes
          : > dist/notes/feature.md
          : > dist/notes/fix.md
          : > dist/notes/performance.md
          : > dist/notes/refactor.md
          : > dist/notes/docs.md
          : > dist/notes/ci.md
          : > dist/notes/chore.md
          : > dist/notes/other.md

          while IFS='|' read -r sha subject; do
            [ -n "${sha}" ] || continue

            type=$(printf '%s' "${subject}" | sed -nE 's/^([A-Za-z]+)(\([^)]+\))?!?: .*/\1/p' | tr '[:upper:]' '[:lower:]')
            message=$(printf '%s' "${subject}" | sed -E 's/^[A-Za-z]+(\([^)]+\))?!?:[[:space:]]*//')
            entry="- ${message} (${sha})"

            case "${type}" in
              feat) printf '%s\n' "${entry}" >> dist/notes/feature.md ;;
              fix) printf '%s\n' "${entry}" >> dist/notes/fix.md ;;
              perf) printf '%s\n' "${entry}" >> dist/notes/performance.md ;;
              refactor) printf '%s\n' "${entry}" >> dist/notes/refactor.md ;;
              docs) printf '%s\n' "${entry}" >> dist/notes/docs.md ;;
              ci|build) printf '%s\n' "${entry}" >> dist/notes/ci.md ;;
              chore|style|test) printf '%s\n' "${entry}" >> dist/notes/chore.md ;;
              *) printf '%s\n' "- ${subject} (${sha})" >> dist/notes/other.md ;;
            esac
          done < <(git log "${LOG_RANGE}" --no-merges --pretty=format:'%h|%s')

          {
            echo "Automated prerelease build from commit ${{ github.sha }}."
            echo "Branch: ${{ github.ref_name }}"
            echo
            echo "## ${COMPARE_TEXT}"
            echo

            for section in \
              "Feature:dist/notes/feature.md" \
              "Fix:dist/notes/fix.md" \
              "Performance:dist/notes/performance.md" \
              "Refactor:dist/notes/refactor.md" \
              "Documentation:dist/notes/docs.md" \
              "CI / Build:dist/notes/ci.md" \
              "Chore:dist/notes/chore.md" \
              "Other:dist/notes/other.md"; do
              title="${section%%:*}"
              file="${section#*:}"
              if [ -s "${file}" ]; then
                echo "${title}:"
                cat "${file}"
                echo
              fi
            done

            echo "Artifacts:"
            echo "- \`maibot-manager-linux-x86_64\`: Linux x86_64"
            echo "- \`maibot-manager-linux-arm64\`: Linux aarch64"
            echo "- \`maibot-manager-windows-x86_64.exe\`: Windows 10/11 x86_64"
            echo "- \`maibot-manager-macos-x86_64\`: macOS x86_64"
            echo "- \`maibot-manager-macos-arm64\`: macOS Apple Silicon"
          } > dist/release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"

          ASSETS=(
            dist/maibot-manager-linux-x86_64
            dist/maibot-manager-linux-arm64
            dist/maibot-manager-windows-x86_64.exe
            dist/maibot-manager-macos-x86_64
            dist/maibot-manager-macos-arm64
          )

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "${TITLE}" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --repo "${GITHUB_REPOSITORY}"
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file dist/release-notes.md \
              --target "${{ github.sha }}" \
              --prerelease \
              --repo "${GITHUB_REPOSITORY}" \
              "${ASSETS[@]}"
          fi
