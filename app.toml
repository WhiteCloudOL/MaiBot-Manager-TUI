# MaiBot Manager TUI 构建配置
# 修改后重新执行 build-release.sh / build-release.ps1，新值会被烘焙进二进制。

# 程序版本号（同时会同步到 Cargo.toml 的 [package].version 时由人工保持一致）
version = "0.3.4"

# 标头显示内容，修改后会被烘焙进二进制。
header_title = "MaiBot-Manager-TUI"
header_subtitle = "MaiBot 管理面板"
header_credit = "作者：清蒸云鸭 · 许可：AGPL-3.0"
header_docs = "文档：https://docs.meowyun.cn/index.html"

# 兼容旧字段：header_subtitle 为空时使用 build_label
build_label = "MaiBot 管理面板"

# 测速时使用的目标文件，用于评估各镜像的真实下载延迟
github_test_path = "https://raw.githubusercontent.com/Mai-with-u/MaiBot/refs/heads/main/README.md"

# GitHub 镜像源列表（按顺序作为候选；官方直连会被自动加入）
github_mirrors = [
    "https://gh-proxy.org",
    "https://hk.gh-proxy.org",
    "https://cdn.gh-proxy.org",
    "https://ghproxy.net",
    "https://ghfast.top",
    "https://github.moeyy.xyz",
]

# 没有 Docker 时，apt/dnf/yum 系优先尝试的一键安装脚本
docker_oneliner = "bash <(curl -sSL https://linuxmirrors.cn/docker.sh)"
